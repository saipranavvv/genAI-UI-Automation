<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automation Test Results</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Automation Test Results</h1>
    </header>
    <div class="summary-report">
  <p class="summary-line">Number of tests executed: <span class="test-count">1</span></p>
  <p class="summary-line">Failures : <span class="failure-count">0</span></p>
</div>


<p class="success-message"><span>100% Successful</span></p>
    <div id="feature-container">
    <p> Loading feature data...</p>
</div>
    <div id="image-container">
        <p id="loading-message">Loading images and data...</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
